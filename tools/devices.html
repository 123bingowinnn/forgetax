<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#222;color:#ccc;font:12px sans-serif;display:flex;flex-wrap:wrap;gap:12px;padding:12px;align-items:flex-start}
.d{display:flex;flex-direction:column;gap:4px} iframe{border:0;background:#000;display:block}
</style></head><body>
<script>
// 用法：tools/devices.html?shot=anvil&lv=9&d=844x390,390x844
const q = new URLSearchParams(location.search);
const devs = (q.get('d') || '844x390').split(',');
q.delete('d');
const hash = [...q.entries()].map(([k, v]) => k + '=' + v).join('&') + '&touch=1';
devs.forEach(d => {
  const [w, h] = d.split('x').map(Number);
  const box = document.createElement('div'); box.className = 'd';
  box.innerHTML = `<div>${d}</div><iframe width="${w}" height="${h}" src="../dev.html#${hash}"></iframe>`;
  document.body.appendChild(box);
});
</script></body></html>
