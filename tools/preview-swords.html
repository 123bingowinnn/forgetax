<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>swords preview</title>
<style>
  body{margin:0;background:#141010;overflow:hidden;font-family:"PingFang SC",sans-serif}
  #labels div{position:absolute;color:#e8d6b8;font-size:11px;transform:translate(-50%,0);white-space:nowrap;text-shadow:0 1px 2px #000;text-align:center}
  #labels img{position:absolute;opacity:0.95}
  #err{position:absolute;left:0;top:0;color:#f66;font:12px monospace;white-space:pre;z-index:9}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body><div id="labels"></div><div id="err"></div>
<script>
  window.addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e) + ' @' + e.filename + ':' + e.lineno + '\n'; });
  window.addEventListener('unhandledrejection', e => { document.getElementById('err').textContent += 'REJ ' + (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script type="module">
// 用法：
//   ?ids=1,38,39            指定形态（可写 30:heat / 30:frenzy / 30:break / 30:toggle）
//   ?family=base|lanes|rune|split|citadel|holy|saw|dragon|tree|fish|funeral|all
//   &cmp=1                  在每把剑右侧贴参考图 ref/wiki/swords/<id>.webp
//   &cols=4 &t=1.5 &static=1 &tilt=0.5（俯视倾角，弧度）&legacy=1（旧 API 网格）
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildSword, setSwordHeat, setSwordFrenzy, updateSwordFx, breakSword, FORM_IDS, hasForm, VARIANTS, setSwordVariant, setSwordAura } from '../src/swords.js';

const FAM = {
  base: [1, 38, 39, 2, 3, 4, 5, 6, 7], lanes: [2, 3, 4, 5, 6, 7],
  citadel: [8, 40, 9, 10, 11, 12], holy: [13, 41, 14, 15, 16, 17],
  saw: [18, 42, 19, 20, 21, 22], dragon: [23, 43, 24, 25, 26, 27],
  rune: [28, 44, 29, 30, 31, 32], split: [33, 45, 34, 35, 36, 37],
  tree: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110],
  fish: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210],
  funeral: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010],
  magma: [60, 61, 62, 63, 64, 65], thunder: [70, 71, 72, 73, 74, 75], frost: [50, 51, 52, 53, 54, 55],
  star: [400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410],
  clock: [500, 501, 502, 503, 504, 505, 506, 507, 508, 509, 510],
  hidden: [60, 61, 62, 63, 64, 65, 70, 71, 72, 73, 74, 75, 50, 51, 52, 53, 54, 55],
  all: FORM_IDS,
};
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141010);

// 单元格语法：id[:token...]，token = heat | heat5 | frenzy | break | toggle | <品相id> | a0..a3
let cells;
const VIDS = VARIANTS.map(v => v.id);
if (q.get('vgrid')) cells = q.get('vgrid').split(',').flatMap(id => VIDS.map(v => ({ id: +id, fx: v })));
else if (q.get('agrid')) cells = q.get('agrid').split(',').flatMap(id => [0, 1, 2, 3].map(a => ({ id: +id, fx: (q.get('variant') ? q.get('variant') + ':' : '') + 'a' + a })));
else if (q.get('ids')) cells = q.get('ids').split(',').map(s => { const [id, ...fx] = s.split(':'); return { id: +id, fx: fx.join(':') }; });
else cells = (FAM[q.get('family') || 'base'] || FAM.base).map(id => ({ id, fx: '' }));
const cmp = !!q.get('cmp');

// 先构建，测量尺寸后排版
const items = cells.map(c => {
  const s = buildSword(c.id, { level: +(q.get('level') || 0) });
  const toks = c.fx ? c.fx.split(':') : [];
  const gv = q.get('variant'), ga = q.get('aura');
  const vt = toks.find(t => VIDS.includes(t)) || gv;
  if (vt) setSwordVariant(s, vt);
  const at = toks.find(t => /^a[0-3]$/.test(t));
  const aura = at ? +at[1] : (ga ? +ga : 0);
  if (aura) setSwordAura(s, aura);
  c.fx = toks.filter(t => !VIDS.includes(t) && !/^a[0-3]$/.test(t)).join(':');
  if (c.fx === 'heat') setSwordHeat(s, 1);
  if (c.fx === 'heat5') setSwordHeat(s, 0.5);
  if (c.fx === 'frenzy') setSwordFrenzy(s, true);
  if (c.fx === 'toggle') { setSwordHeat(s, 1); setSwordFrenzy(s, true); setSwordHeat(s, 0.4); setSwordFrenzy(s, false); setSwordHeat(s, 0); }
  let note = [vt && vt !== 'plain' ? vt : (toks.includes('plain') ? 'plain' : ''), aura ? 'aura' + aura : (at ? 'aura0' : ''), c.fx].filter(Boolean).join(' ');
  if (c.fx === 'break') {
    const parts = breakSword(s);
    s.children[0].visible = false;
    parts.forEach((p, j) => { p.position.multiplyScalar(1.12); p.position.y += 0.02; p.rotation.y = (j % 3 - 1) * 0.15; s.add(p); });
    note = 'break ' + parts.length;
  }
  return { s, c, note };
});
const n = items.length;
const cols = +(q.get('cols') || (q.get('vgrid') ? 8 : q.get('agrid') ? 4 : Math.min(n, n <= 4 ? n : n <= 9 ? (n <= 6 ? 3 : 5) : 6)));
const rows = Math.ceil(n / cols);
let cw = 0, chh = 0;
for (const it of items) { const u = it.s.userData; cw = Math.max(cw, u.width); chh = Math.max(chh, u.length); }
cw = cw * (cmp ? 2.0 : 1) + 0.12; chh += 0.22;
// 剑尖朝屏幕上方（世界 -Z），参考图右侧（+Z）→ 屏幕右（世界 +X）
items.forEach((it, i) => {
  const col = i % cols, row = Math.floor(i / cols);
  const u = it.s.userData;
  const cx = (col - (cols - 1) / 2) * cw - (cmp ? cw * 0.25 : 0);
  const cz = (row - (rows - 1) / 2) * chh;
  it.s.rotation.y = Math.PI / 2;
  it.s.position.set(cx, 0, cz + (u.tipX + u.pommelX) / 2);
  it.cx = cx; it.cz = cz;
  scene.add(it.s);
});
const tilt = +(q.get('tilt') ?? 0.35);
const spanW = cols * cw, spanH = rows * chh;
const aspect = W / H;
let vw = spanW, vh = spanH * Math.cos(tilt) + 0.2;
if (vw / vh > aspect) vh = vw / aspect; else vw = vh * aspect;
const cam = new THREE.OrthographicCamera(-vw / 2, vw / 2, vh / 2, -vh / 2, 0.1, 100);
cam.position.set(0, 10 * Math.cos(tilt), 10 * Math.sin(tilt));
cam.lookAt(0, 0, 0);
cam.updateProjectionMatrix(); cam.updateMatrixWorld();

scene.add(new THREE.AmbientLight(0x5a5550, 0.7));
scene.add(new THREE.HemisphereLight(0x9a9490, 0x201410, 0.6));
const dl = new THREE.DirectionalLight(0xfff4ea, 2.0);
dl.position.set(-3, 6, 5); scene.add(dl);
const pl = new THREE.PointLight(0xffa060, 8, 0, 2);
pl.position.set(2, 2.5, 2); scene.add(pl);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.4, 0.85));
composer.addPass(new OutputPass());

const lab = document.getElementById('labels');
const toPx = (v) => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; };
items.forEach(it => {
  let t = 0; it.s.traverse(o => { if (o.isMesh && o.visible) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  const u = it.s.userData;
  const d = document.createElement('div');
  d.textContent = `#${it.c.id}${hasForm(it.c.id) ? '' : '(缺)'} ${it.note} L${u.length.toFixed(2)} W${u.width.toFixed(2)} ${Math.round(t)}△`;
  const [x, y] = toPx(new THREE.Vector3(it.cx, 0, it.cz + chh / 2 - 0.06));
  d.style.left = x + 'px'; d.style.top = y + 'px';
  lab.appendChild(d);
  if (cmp) {
    const [x0, y0] = toPx(new THREE.Vector3(it.cx + cw * 0.25, 0, it.cz - chh / 2 + 0.05));
    const [x1, y1] = toPx(new THREE.Vector3(it.cx + cw * 0.25, 0, it.cz + chh / 2 - 0.1));
    const img = document.createElement('img');
    img.src = `../ref/wiki/swords/${it.c.id}.webp`;
    const hpx = y1 - y0;
    img.style.height = hpx + 'px'; img.style.left = (x0 + (cw * 0.5 / vw * W) * 0.5 - hpx / 2) + 'px'; img.style.top = y0 + 'px';
    lab.appendChild(img);
  }
});

const T0 = +(q.get('t') || 1.0);
function frame(t) {
  updateSwordFx(t);
  for (const { s } of items) s.userData.update(0.016, t);
  composer.render();
}
for (const { s } of items) s.userData.update(T0, T0);
frame(T0);
document.title = 'ok';
const clock = new THREE.Clock();
if (!q.get('static')) renderer.setAnimationLoop(() => frame(T0 + clock.getElapsedTime()));
</script></body></html>
