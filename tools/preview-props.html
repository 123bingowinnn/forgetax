<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>props preview</title>
<style>body{margin:0;background:#000;overflow:hidden}#info{position:fixed;left:8px;top:6px;color:#9a9;font:12px monospace;z-index:2}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body><div id="info"></div>
<script type="module">
// 用法: preview-props.html#all | #anvil | #hammer | #furnace | #cage[:watch|angry|happy|hidden] | #altar | #bell
//       | #vending | #ghost | #rack | #shelf | #lamp | #star | #clutter | #room
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as P from '../src/props.js';
import { makeMaterials, applyWorldUV, TEX_TILE } from '../src/textures.js';

const [name, arg] = (location.hash.slice(1).replace('!', '') || 'all').split(':');
document.getElementById('info').textContent = name + (arg ? ':' + arg : '');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 60);
scene.add(new THREE.AmbientLight(0x404858, 0.5));
scene.add(new THREE.HemisphereLight(0x8090a0, 0x201810, 0.35));

const M = makeMaterials();
// 背景：砖墙 + 地砖
function wall(w, h, mat, tile, x, y, z, ry = 0) {
  const g = new THREE.BoxGeometry(w, h, 0.1); applyWorldUV(g, tile);
  const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m;
}
function floor(w, d) {
  const g = new THREE.BoxGeometry(w, 0.1, d); applyWorldUV(g, TEX_TILE.floor);
  const m = new THREE.Mesh(g, M.floor); m.position.y = -0.05; m.receiveShadow = true; scene.add(m);
}

const updaters = [];
function add(obj, x = 0, y = 0, z = 0, ry = 0) {
  obj.position.set(x, y, z); obj.rotation.y = ry; scene.add(obj);
  if (obj.userData.update) updaters.push(obj.userData.update);
  return obj;
}
// 预览用：在价签/屏幕上画示例文字
function textTex(lines, w = 256, h = 72, size = 34, color = '#eee', bg = '#060606') {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = color; g.font = `${size}px sans-serif`; g.textBaseline = 'middle';
  lines.forEach(([t, x, y, s, col]) => { if (s) g.font = `${s}px sans-serif`; if (col) g.fillStyle = col; g.fillText(t, x, y); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function dressVending(v) {
  v.userData.pricePlates.forEach((p) => { p.material.map = textTex([['🗡', 80, 38, 34], ['1', 150, 38, 40]]); });
  v.userData.counterScreen.material.map = textTex([['🗡', 30, 56, 50], ['00', 110, 60, 80]], 256, 112);
  v.userData.hintPlate.material.map = textTex([['🗡 → 🗡 ×1', 30, 32, 30]], 256, 64);
  v.userData.refreshLabel.material.map = textTex([['208 G', 70, 32, 40]], 256, 64, 40, '#eee', '#000');
  // 示例展示物
  const geos = [new THREE.ConeGeometry(0.1, 0.22, 4), new THREE.TorusKnotGeometry(0.07, 0.022, 48, 6), new THREE.CylinderGeometry(0.03, 0.06, 0.2, 8)];
  v.userData.windows.forEach((w, i) => { const m = new THREE.Mesh(geos[i], new THREE.MeshStandardMaterial({ color: 0x6a7a6e, roughness: 0.5 })); m.position.y = 0.15; w.add(m); });
}
function dressGhost(gh) {
  const geos = [new THREE.BoxGeometry(0.5, 0.03, 0.03), new THREE.BoxGeometry(0.5, 0.07, 0.015), new THREE.CylinderGeometry(0.1, 0.1, 0.04, 16), new THREE.ConeGeometry(0.12, 0.22, 4)];
  gh.userData.itemSlots.forEach((s, i) => {
    const m = new THREE.Mesh(geos[i], new THREE.MeshStandardMaterial({ color: [0x6a4a30, 0xb8c0c8, 0x8a4a20, 0x222222][i], roughness: 0.6 }));
    if (i < 2) m.rotation.z = i ? -0.6 : 0.6; else if (i === 2) { m.rotation.x = Math.PI / 2; m.position.y = 0.1; } else m.position.y = 0.11;
    s.add(m);
  });
}
function demoSword(len = 0.75, wid = 0.07) {
  const g = new THREE.Group();
  const blade = new THREE.Mesh(new THREE.BoxGeometry(len, 0.012, wid), new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.4, metalness: 0.4 }));
  blade.position.x = len / 2 + 0.02; g.add(blade);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, Math.max(0.22, wid + 0.08)), new THREE.MeshStandardMaterial({ color: 0x777777 })));
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.025, 0.03), new THREE.MeshStandardMaterial({ color: 0x3a2a20 })); grip.position.x = -0.1; g.add(grip);
  return g;
}

const cams = {};
function cam(px, py, pz, tx, ty, tz, fov = 55) { camera.fov = fov; camera.updateProjectionMatrix(); camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); }
function keyLight(x, y, z, i = 3, c = 0xffd0a0) { const l = new THREE.PointLight(c, i, 10, 1.5); l.position.set(x, y, z); scene.add(l); return l; }

if (name === 'all') {
  floor(16, 10); wall(16, 3, M.brick, TEX_TILE.brick, 0, 1.5, -2.6);
  add(P.buildAnvil(), -6.5, 0, 0.5); const h = add(P.buildHammer(), -5.6, 0.0, 0.8); h.rotation.z = 0.0;
  add(P.buildFurnace(), -4.3, 0, -2.55);
  const c = add(P.buildCage(), -1.6, 0, -2.55); c.userData.setEyeState('watch');
  add(P.buildAltarTable(), -1.6, 0, -0.9); add(P.buildBell(), -2.3, 0.9, -0.75);
  const v = add(P.buildVendingMachine(), 0.8, 0, -2.25); dressVending(v);
  const gh = add(P.buildGhost(), 3.0, 0, -1.6); dressGhost(gh);
  add(P.buildSwordRack(), 5.4, 0, -2.55);
  add(P.buildRelicShelf(), 5.4, 0, 0.2, -Math.PI / 2 + 0.0).rotation.y = -0.6;
  add(P.buildCeilingLamp(), 0.8, 3.0, -1.9);
  add(P.buildWallStar(), -6.5, 2.1, -2.5);
  for (const [k, x] of [['crate', 7.0], ['barrel', 7.3], ['bucket', 6.7]]) add(P.buildClutter(k), x, 0, 1.4);
  keyLight(0, 2.5, 3, 4);
  cam(0, 2.2, 5.0, 0, 1.1, -1.5, 75);
} else if (name === 'anvil' || name === 'hammer') {
  floor(6, 6); wall(6, 3, M.brick, TEX_TILE.brick, 0, 1.5, -1.0);
  const a = add(P.buildAnvil());
  const s = demoSword(0.6); a.userData.swordSpot.add(s); s.position.y = 0.01;
  const h = add(P.buildHammer(), 0.75, 0.95, 0.1);
  h.rotation.set(0, 0, Math.PI / 2 - 0.15); // 平握，锤头在左
  const h2 = add(P.buildHammer(), -1.1, 0, 0.3);
  add(P.buildWallStar(), 0, 2.3, -0.9);
  keyLight(-0.6, 1.8, 1.4, 3); keyLight(1.5, 1.2, 0.8, 1.5, 0xff8a40);
  if (name === 'hammer') cam(0.2, 1.2, 1.3, 0.2, 0.85, 0, 50); else cam(0.15, 1.75, 2.0, 0.1, 0.8, 0, 50);
} else if (name === 'furnace') {
  floor(6, 6); wall(6, 3, M.brick, TEX_TILE.brick, 0, 1.5, -0.05);
  const f = add(P.buildFurnace());
  if (arg !== 'nosword') { const s = demoSword(0.8); f.userData.heatSpot.add(s); }
  if (arg === 'side') cam(2.2, 1.6, 2.2, 0, 1.0, 0.4, 50); else cam(0, 1.6, 2.4, 0, 1.0, 0, 50);
} else if (name === 'cage' || name === 'altar' || name === 'bell') {
  floor(6, 6);
  const c = add(P.buildCage(), 0, 0, -0.5);
  for (const sx of [-1, 1]) wall(2, 3, M.stone, TEX_TILE.stone, sx * 2.0, 1.5, -0.55);
  wall(2, 0.6, M.stone, TEX_TILE.stone, 0, 2.7, -0.55);
  c.userData.setEyeState(arg || 'watch');
  const t = add(P.buildAltarTable(), 0, 0, 0.05);
  const b = add(P.buildBell()); t.userData.bellSpot.add(b); b.position.set(0, 0, 0); scene.attach(b);
  t.userData.slots.forEach((s, i) => { if (i % 2 === 0) s.add(demoSword(0.6 + i * 0.05)); });
  t.userData.boardFace.material.map = textTex([['TRIBUTE DUE', 20, 22, 22], ['1,800', 380, 22, 24], ['OFFERED', 20, 56, 22], ['1,661', 380, 58, 30]], 512, 80);
  keyLight(0.5, 2.3, 1.8, 2.2, 0xd0d8c8);
  if (name === 'bell') cam(-0.75, 1.25, 1.0, -0.72, 0.95, 0.25, 45);
  else if (name === 'altar') cam(0.3, 1.6, 2.2, 0, 0.75, 0.1, 55);
  else cam(0, 1.65, 2.3, 0, 1.4, -0.4, 55);
} else if (name === 'vending') {
  floor(6, 6);
  const v = add(P.buildVendingMachine(), 0, 0, -0.3); dressVending(v);
  for (const sx of [-1, 1]) wall(2, 3, M.stone, TEX_TILE.stone, sx * 2.0, 1.5, -0.55);
  wall(2, 0.8, M.stone, TEX_TILE.stone, 0, 2.6, -0.55);
  add(P.buildCeilingLamp(), 0, 3.0, 0.3);
  keyLight(0, 2.0, 2.5, 0.8, 0xc0d0c0);
  if (arg === 'side') cam(-1.4, 1.5, 1.6, 0.2, 1.1, -0.3, 55); else cam(0, 1.45, 2.6, 0, 1.25, -0.3, 55);
} else if (name === 'ghost') {
  floor(6, 6); wall(6, 3.5, M.brick, TEX_TILE.brick, 0, 1.75, -0.8);
  const f = add(P.buildFurnace(), -1.9, 0, -0.75);
  const gh = add(P.buildGhost(), 0, 0, 0); dressGhost(gh);
  cam(0, 1.45, 2.4, 0, 1.15, 0, 55);
} else if (name === 'rack' || name === 'shelf') {
  floor(9, 6); wall(9, 3, M.brick, TEX_TILE.brick, 0, 1.5, -0.05);
  const r = add(P.buildSwordRack(), -1.3, 0, 0);
  // 模拟 lead 的缩放：scale = min(1, 1.05 / 总长)
  const lens = [0.6, 0.9, 1.6, 0.75, 1.2, 0.7, 1.0, 0.8, 1.4, 0.65, 1.1, 0.9];
  const wids = [0.08, 0.1, 0.6, 0.09, 0.25, 0.08, 0.12, 0.1, 0.35, 0.08, 0.14, 0.1];
  r.userData.slots.forEach((s, i) => { const total = lens[i]; const sw = demoSword(total - 0.25, wids[i]); sw.scale.setScalar(Math.min(1, 1.05 / total)); s.add(sw); });
  add(P.buildWallLamp(), -1.3, 2.35, 0.0);
  const hatch = add(P.buildHatch(), 0.85, 1.35, 0.0);
  if (arg !== 'closed') hatch.userData.open(arg === 'half' ? 0.5 : 1);
  const sh = add(P.buildRelicShelf(), 2.6, 0, 0);
  sh.userData.slots.forEach((s) => { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.08, 0), M.gold); m.position.y = 0.08; s.add(m); });
  keyLight(0, 2.4, 3.5, 1.2, 0xc0b0a0);
  if (name === 'shelf') cam(2.6, 1.4, 2.4, 2.6, 1.1, 0, 55); else cam(-0.5, 1.3, 3.6, -0.5, 1.15, 0, 55);
} else if (name === 'hatch') {
  floor(4, 4); wall(4, 3, M.brick, TEX_TILE.brick, 0, 1.5, -0.05);
  const h = add(P.buildHatch(), 0, 1.3, 0); h.userData.open(arg === 'open' ? 1 : arg === 'half' ? 0.5 : 0);
  add(P.buildWallLamp(), 0.75, 1.9, 0);
  keyLight(0, 1.6, 1.8, 0.8, 0xc0b0a0);
  cam(0.3, 1.5, 1.7, 0, 1.35, 0, 55);
} else if (name === 'stats') {
  const out = [];
  for (const [k, fn] of Object.entries({ ...P.PROP_BUILDERS, crate: () => P.buildClutter('crate'), barrel: () => P.buildClutter('barrel') })) {
    const o = fn(); let tris = 0, meshes = 0;
    o.traverse((c) => { if (c.isMesh) { meshes++; const g = c.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
    const bb = new THREE.Box3().setFromObject(o); const sz = bb.getSize(new THREE.Vector3());
    out.push(`${k}: tris=${tris|0} meshes=${meshes} size=${sz.x.toFixed(2)}x${sz.y.toFixed(2)}x${sz.z.toFixed(2)} min=(${bb.min.x.toFixed(2)},${bb.min.y.toFixed(2)},${bb.min.z.toFixed(2)})`);
  }
  const pre = document.createElement('pre'); pre.id = 'stats'; pre.style.color = '#fff'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
} else if (name === 'lamp' || name === 'star' || name === 'clutter') {
  floor(6, 6); wall(6, 3, M.brick, TEX_TILE.brick, 0, 1.5, -1.2);
  add(P.buildCeilingLamp(), -0.8, 3.0, 0);
  add(P.buildWallStar(), 0.8, 2.0, -1.1);
  ['crate', 'barrel', 'bucket', 'coal'].forEach((k, i) => add(P.buildClutter(k), -1.2 + i * 0.8, 0, 0.3));
  add(P.buildClutter('chain'), 1.6, 2.6, -0.9); add(P.buildClutter('tongs'), 1.9, 0, -0.8);
  keyLight(0, 2, 2, 1.5);
  cam(0, 1.6, 3.4, 0, 1.1, 0, 55);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.82));
composer.addPass(new OutputPass());

// 预热动画（眼睛缓缓睁开等），再同步渲染一帧
let t = 0;
for (let i = 0; i < 150; i++) { t += 1 / 30; updaters.forEach((u) => u(1 / 30, t)); }
composer.render();
let tris = 0; renderer.info.autoReset = true;
document.title = 'ok';
window.__tris = renderer.info.render.triangles;
document.getElementById('info').textContent += '  tris=' + renderer.info.render.triangles;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  updaters.forEach((u) => u(dt, t));
  composer.render();
  requestAnimationFrame(loop);
}
if (!location.hash.includes('!')) requestAnimationFrame(loop);
</script></body></html>
